name: opensenpai-split
x-application: &application
  build: .
  image: opensenpai:local
  init: true
  restart: unless-stopped
  profiles: [split]
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: ${DATABASE_URL:-http://database:8080}
    DATABASE_AUTH_TOKEN: ${DATABASE_AUTH_TOKEN:-}
    MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN in your environment or .env}
    WORKSPACE_ID: ${WORKSPACE_ID:-local}
    VALKEY_URL: redis://valkey:6379
  depends_on:
    valkey:
      condition: service_healthy
    database:
      condition: service_healthy
      required: false
services:
  api:
    <<: *application
    command: ["--role", "api", "--transport", "http", "--port", "4111"]
    ports:
      - "127.0.0.1:${PORT:-4111}:4111"
  worker:
    <<: *application
    command: ["--role", "worker", "--transport", "http", "--port", "4111"]
    # No published port: worker health/readiness is private to its container network.
  database:
    image: ghcr.io/tursodatabase/libsql-server:v0.24.32
    profiles: [database]
    restart: unless-stopped
    environment:
      SQLD_NODE: primary
      SQLD_DB_PATH: /var/lib/sqld/iku.db
      SQLD_HTTP_LISTEN_ADDR: 0.0.0.0:8080
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; read -r status <&3; [[ \"$$status\" == *' 200 '* ]]"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - database-data:/var/lib/sqld
  valkey:
    image: valkey/valkey:8.1.6-alpine
    profiles: [split]
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - valkey-data:/data
volumes:
  database-data:
  valkey-data:
