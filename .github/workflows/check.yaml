name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec tsc --noEmit -p deploy/cloudflare/tsconfig.json
      - run: pnpm exec wrangler deploy --dry-run --config deploy/cloudflare/wrangler.json
      - run: docker build --tag opensenpai:check .
      - run: MCP_AUTH_TOKEN=ci-mock-token docker compose config --quiet
      - run: MCP_AUTH_TOKEN=ci-mock-token docker compose -f compose.split.yaml --profile split --profile database config --quiet
